name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Override deployment target for CI runner compatibility
  MACOSX_DEPLOYMENT_TARGET: '14.5'
  # Skip code signing on CI
  CODE_SIGN_IDENTITY: ''
  CODE_SIGNING_REQUIRED: 'NO'
  CODE_SIGNING_ALLOWED: 'NO'

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26 on this runner. The project relies on Xcode 26 build settings (SWIFT_DEFAULT_ACTOR_ISOLATION)."
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build
        run: >
          xcodebuild -scheme "Focusrite Volume Control" -configuration Debug
          MACOSX_DEPLOYMENT_TARGET=14.5
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          build

      - name: Test
        run: >
          xcodebuild test -scheme "Focusrite Volume Control" -configuration Debug
          MACOSX_DEPLOYMENT_TARGET=14.5
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
