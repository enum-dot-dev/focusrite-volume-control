name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-dmg:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build Release
        run: >
          xcodebuild -scheme "Focusrite Volume Control" -configuration Release
          MACOSX_DEPLOYMENT_TARGET=14.5
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          build

      - name: Package DMG
        run: |
          BUILT_APP=$(find ~/Library/Developer/Xcode/DerivedData/Focusrite_Volume_Control-* \
            -path "*/Build/Products/Release/Focusrite Volume Control.app" -maxdepth 5 | head -1)
          mkdir -p build/dmg
          cp -R "$BUILT_APP" build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create \
            -volname "Focusrite Volume Control" \
            -srcfolder build/dmg \
            -ov -format UDZO \
            build/FocusriteVolumeControl.dmg

      - name: Compute DMG SHA256
        id: sha
        run: echo "sha256=$(shasum -a 256 build/FocusriteVolumeControl.dmg | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/FocusriteVolumeControl.dmg
          generate_release_notes: true
          body: |
            **Homebrew:**
            ```
            brew tap enum-labs/focusrite-volume-control
            brew install --cask focusrite-volume-control
            ```

            **DMG SHA256:** `${{ steps.sha.outputs.sha256 }}`

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          DMG_SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git clone https://x-access-token:${GH_TOKEN}@github.com/enum-labs/homebrew-focusrite-volume-control.git tap
          cd tap
          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Casks/focusrite-volume-control.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${DMG_SHA256}\"/" Casks/focusrite-volume-control.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/focusrite-volume-control.rb
          if ! git diff --cached --quiet; then
            git commit -m "bump to v${VERSION}"
            git push
          fi
